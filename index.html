<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Icon Forge</title>
    <link rel="stylesheet" href="style.css">
    <!-- Шрифты и иконки (Font Awesome для красоты) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- БОКОВОЕ МЕНЮ (НАВИГАЦИЯ) -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>IconForge</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="dashboard">
                    <i class="fas fa-th-large"></i> <span>Дашборд</span>
                </button>
                <button class="nav-item" data-tab="generator">
                    <i class="fas fa-wand-magic-sparkles"></i> <span>Генератор</span>
                </button>
                <button class="nav-item" data-tab="history">
                    <i class="fas fa-clock-rotate-left"></i> <span>История</span>
                </button>
                <button class="nav-item" data-tab="settings">
                    <i class="fas fa-sliders"></i> <span>Настройки</span>
                </button>
            </nav>
            <div class="user-status">
                <i class="fas fa-circle" style="color: #0f0; font-size: 10px;"></i>
                <span>Система готова</span>
            </div>
        </aside>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <main class="main-content">
            <!-- Шапка -->
            <header class="top-bar">
                <h1 id="page-title">Дашборд</h1>
                <div class="top-actions">
                    <button id="clear-storage-btn" class="icon-btn" title="Очистить кэш">
                        <i class="fas fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <!-- КОНТЕЙНЕР ДЛЯ СТРАНИЦ (TABS) -->
            <div class="tab-content" id="tab-content">
                <!-- Вкладка: Дашборд -->
                <section id="page-dashboard" class="page active-page">
                    <div class="stats-grid">
                        <div class="stat-card"><i class="fas fa-icons"></i><span id="stat-total">0</span><p>Сгенерировано</p></div>
                        <div class="stat-card"><i class="fas fa-palette"></i><span id="stat-styles">0</span><p>Стилей в библиотеке</p></div>
                        <div class="stat-card"><i class="fas fa-microchip"></i><span>v1.0</span><p>Версия ядра</p></div>
                    </div>
                    <div class="recent-section">
                        <h3>Последние иконки</h3>
                        <div class="recent-grid" id="recent-grid">
                            <!-- Сюда динамически будут подгружаться миниатюры -->
                        </div>
                    </div>
                </section>

                <!-- Вкладка: Генератор -->
                <section id="page-generator" class="page">
                    <div class="generator-layout">
                        <!-- Панель настроек -->
                        <div class="control-panel">
                            <h3><i class="fas fa-sliders-h"></i> Параметры генерации</h3>
                            
                            <div class="control-group">
                                <label>Тематика</label>
                                <select id="theme-select">
                                    <option value="abstract">Абстракция</option>
                                    <option value="nature">Природа</option>
                                    <option value="tech">Технологии</option>
                                    <option value="business">Бизнес</option>
                                    <option value="art">Искусство</option>
                                </select>
                            </div>

                            <div class="control-group">
                                <label>Стилистика</label>
                                <select id="style-select">
                                    <option value="minimalist">Минимализм</option>
                                    <option value="vibrant">Яркий неон</option>
                                    <option value="pastel">Пастель</option>
                                    <option value="monochrome">Монохром</option>
                                    <option value="gradient">Градиент</option>
                                </select>
                            </div>

                            <div class="control-group">
                                <label>Сложность (1-10)</label>
                                <input type="range" id="complexity-slider" min="1" max="10" value="5">
                                <span id="complexity-value">5</span>
                            </div>

                            <div class="control-group">
                                <label>Асимметрия</label>
                                <input type="range" id="asymmetry-slider" min="0" max="100" value="30">
                                <span id="asymmetry-value">30%</span>
                            </div>

                            <button id="generate-btn" class="primary-btn">
                                <i class="fas fa-bolt"></i> Сгенерировать
                            </button>
                        </div>

                        <!-- Область предпросмотра -->
                        <div class="preview-area">
                            <div class="icon-preview" id="icon-preview">
                                <canvas id="generation-canvas" width="300" height="300"></canvas>
                            </div>
                            <div class="preview-actions">
                                <button id="download-png-btn" class="secondary-btn"><i class="fas fa-download"></i> PNG</button>
                                <button id="download-svg-btn" class="secondary-btn"><i class="fas fa-code"></i> SVG</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Вкладка: История -->
                <section id="page-history" class="page">
                    <h3>Архив генераций</h3>
                    <div id="history-list" class="history-list">
                        <!-- Список сохраненных элементов -->
                        <div class="empty-state">Пока нет сохраненных иконок</div>
                    </div>
                </section>

                <!-- Вкладка: Настройки -->
                <section id="page-settings" class="page">
                    <h3>Настройки профиля</h3>
                    <div class="settings-group">
                        <label>Имя пользователя</label>
                        <input type="text" id="username-input" placeholder="Введите имя...">
                    </div>
                    <div class="settings-group">
                        <label>Тема интерфейса</label>
                        <select id="theme-ui-select">
                            <option value="dark">Темная (по умолчанию)</option>
                            <option value="light">Светлая</option>
                        </select>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Подключаем модули -->
    <script type="module" src="app.js"></script>
</body>
</html>
