<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Icon Forge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- БОКОВОЕ МЕНЮ -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>IconForge</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="dashboard">
                    <i class="fas fa-th-large"></i> <span>Дашборд</span>
                </button>
                <button class="nav-item" data-tab="generator">
                    <i class="fas fa-wand-magic-sparkles"></i> <span>Генератор</span>
                </button>
                <button class="nav-item" data-tab="history">
                    <i class="fas fa-clock-rotate-left"></i> <span>История</span>
                </button>
                <button class="nav-item" data-tab="settings">
                    <i class="fas fa-sliders"></i> <span>Настройки</span>
                </button>
            </nav>
            <div class="user-status">
                <i class="fas fa-circle" style="color: #0f0; font-size: 10px;"></i>
                <span>Система готова</span>
            </div>
        </aside>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">Дашборд</h1>
                <div class="top-actions">
                    <button id="clear-storage-btn" class="icon-btn" title="Очистить кэш">
                        <i class="fas fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <div class="tab-content" id="tab-content">
                <!-- ДАШБОРД -->
                <section id="page-dashboard" class="page active-page">
                    <div class="stats-grid">
                        <div class="stat-card"><i class="fas fa-icons"></i><span id="stat-total">0</span><p>Сгенерировано</p></div>
                        <div class="stat-card"><i class="fas fa-palette"></i><span id="stat-styles">6</span><p>Стилей в библиотеке</p></div>
                        <div class="stat-card"><i class="fas fa-microchip"></i><span>v2.0</span><p>Версия ядра</p></div>
                    </div>
                    <div class="recent-section">
                        <h3>Последние иконки</h3>
                        <div class="recent-grid" id="recent-grid"></div>
                    </div>
                </section>

                <!-- ГЕНЕРАТОР -->
                <section id="page-generator" class="page">
                    <div class="generator-layout">
                        <!-- Панель настроек -->
                        <div class="control-panel" id="control-panel">
                            <h3><i class="fas fa-sliders-h"></i> Конструктор иконки</h3>
                            
                            <!-- Основные параметры -->
                            <div class="control-group">
                                <label>Тематика</label>
                                <select id="theme-select">
                                    <option value="abstract">Абстракция</option>
                                    <option value="nature">Природа</option>
                                    <option value="tech">Технологии</option>
                                    <option value="business">Бизнес</option>
                                    <option value="art">Искусство</option>
                                    <option value="custom">Пользовательская</option>
                                </select>
                            </div>

                            <div class="control-group">
                                <label>Стиль</label>
                                <select id="style-select">
                                    <option value="minimal">Минимализм</option>
                                    <option value="detailed">Детализированный</option>
                                    <option value="geometric">Геометрический</option>
                                    <option value="organic">Органический</option>
                                    <option value="neon">Неоновый</option>
                                    <option value="vintage">Винтаж</option>
                                </select>
                            </div>

                            <!-- Фон -->
                            <div class="control-group">
                                <label>Фон</label>
                                <div class="color-picker-group">
                                    <input type="color" id="bg-color" value="#0a0a0f">
                                    <select id="bg-style">
                                        <option value="solid">Сплошной</option>
                                        <option value="gradient">Градиент</option>
                                        <option value="none">Прозрачный</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Детали (динамические) -->
                            <div id="details-container">
                                <div class="control-group">
                                    <label>Основная фигура</label>
                                    <select id="main-shape">
                                        <option value="circle">Круг</option>
                                        <option value="square">Квадрат</option>
                                        <option value="triangle">Треугольник</option>
                                        <option value="star">Звезда</option>
                                        <option value="hexagon">Шестиугольник</option>
                                        <option value="custom">Своя форма</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label>Цвет основной фигуры</label>
                                    <input type="color" id="main-color" value="#7c3aed">
                                </div>

                                <div class="control-group">
                                    <label>Размер основной фигуры</label>
                                    <input type="range" id="main-size" min="40" max="200" value="120">
                                    <span id="main-size-value">120px</span>
                                </div>

                                <div class="control-group">
                                    <label>Дополнительные элементы</label>
                                    <div class="checkbox-group">
                                        <label><input type="checkbox" class="detail-check" value="dots"> Точки</label>
                                        <label><input type="checkbox" class="detail-check" value="lines"> Линии</label>
                                        <label><input type="checkbox" class="detail-check" value="glow"> Свечение</label>
                                        <label><input type="checkbox" class="detail-check" value="shadow"> Тень</label>
                                        <label><input type="checkbox" class="detail-check" value="pattern"> Узор</label>
                                    </div>
                                </div>

                                <div class="control-group" id="pattern-controls" style="display:none;">
                                    <label>Тип узора</label>
                                    <select id="pattern-type">
                                        <option value="stripes">Полосы</option>
                                        <option value="grid">Сетка</option>
                                        <option value="waves">Волны</option>
                                        <option value="dots">Точечный</option>
                                    </select>
                                </div>
                            </div>

                            <button id="generate-btn" class="primary-btn">
                                <i class="fas fa-bolt"></i> Сгенерировать
                            </button>
                            <button id="reset-defaults-btn" class="secondary-btn" style="width:100%;margin-top:10px;">
                                <i class="fas fa-undo"></i> Сбросить настройки
                            </button>
                        </div>

                        <!-- Область предпросмотра -->
                        <div class="preview-area">
                            <div class="icon-preview" id="icon-preview">
                                <canvas id="generation-canvas" width="400" height="400"></canvas>
                            </div>
                            <div class="preview-actions">
                                <button id="download-png-btn" class="secondary-btn"><i class="fas fa-download"></i> PNG</button>
                                <button id="download-svg-btn" class="secondary-btn"><i class="fas fa-code"></i> SVG</button>
                                <button id="copy-svg-btn" class="secondary-btn"><i class="fas fa-copy"></i> Копировать SVG</button>
                            </div>
                            <div class="preview-info" id="preview-info">
                                <small>Настройки: <span id="preview-settings">Тема: Абстракция, Стиль: Минимализм</span></small>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ИСТОРИЯ -->
                <section id="page-history" class="page">
                    <h3>Архив генераций</h3>
                    <div id="history-list" class="history-list">
                        <div class="empty-state">Пока нет сохраненных иконок</div>
                    </div>
                </section>

                <!-- НАСТРОЙКИ -->
                <section id="page-settings" class="page">
                    <h3>Настройки профиля</h3>
                    <div class="settings-group">
                        <label>Имя пользователя</label>
                        <input type="text" id="username-input" placeholder="Введите имя...">
                    </div>
                    <div class="settings-group">
                        <label>Тема интерфейса</label>
                        <select id="theme-ui-select">
                            <option value="dark">Темная (по умолчанию)</option>
                            <option value="light">Светлая</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>Экспорт по умолчанию</label>
                        <select id="default-export">
                            <option value="png">PNG</option>
                            <option value="svg">SVG</option>
                        </select>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
